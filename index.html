<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>点读绘本屋</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 书架页 -->
<section id="shelf-view" class="view">
  <div class="shelf-top">
    <header class="shelf-header">
      <h1><span class="logo-icon">📚</span> 点读绘本屋</h1>
      <div class="shelf-header-right">
        <button type="button" id="share-cat-btn" class="icon-btn" title="分享本分类链接" aria-label="分享本分类链接">🔗</button>
        <button id="settings-btn" class="icon-btn" title="设置" aria-label="设置">⚙️</button>
      </div>
    </header>
    <nav id="category-bar" class="category-bar" role="tablist" aria-label="故事分类"></nav>
  </div>
  <p id="shelf-hint" class="shelf-hint">点一本书开始阅读吧！不认识的字，点一下就有拼音哦。</p>
  <div id="shelf-grid" class="shelf-grid" role="tabpanel"></div>
</section>

<!-- 阅读页 -->
<section id="reader-view" class="view hidden">
  <header class="reader-header">
    <button id="back-btn" class="icon-btn" title="回到书架" aria-label="回到书架">🏠</button>
    <div id="book-title" class="book-title"></div>
    <div class="reader-header-right">
      <div class="page-tools">
        <button id="first-page-btn" class="page-tool-btn" title="回到第一页" aria-label="回到第一页">⏮</button>
        <span id="page-indicator" class="page-indicator"></span>
      </div>
      <button type="button" id="share-book-btn" class="icon-btn" title="分享本故事链接" aria-label="分享本故事链接">🔗</button>
      <button id="settings-btn-2" class="icon-btn" title="设置" aria-label="设置">⚙️</button>
    </div>
  </header>

  <main class="page-area">
    <div id="page-content" class="page-content">
      <div id="page-image-wrap" class="page-image-wrap">
        <img id="page-image" class="page-image" alt="故事插图" decoding="async" draggable="false">
      </div>
      <div class="page-nav">
        <button id="prev-btn" class="nav-btn nav-prev" aria-label="上一页">‹</button>
        <button id="next-btn" class="nav-btn nav-next" aria-label="下一页">›</button>
      </div>
      <div id="page-text" class="page-text"></div>
    </div>
  </main>
</section>

<!-- 设置面板 -->
<div id="settings-overlay" class="overlay hidden">
  <div class="settings-panel">
    <h2>⚙️ 设置</h2>

    <div class="setting-row">
      <label>气泡停留时间</label>
      <div class="option-group" id="duration-options">
        <button data-value="3000">3秒</button>
        <button data-value="5000">5秒</button>
        <button data-value="10000">10秒</button>
        <button data-value="30000">30秒</button>
        <button data-value="0">不消失</button>
      </div>
    </div>

    <div class="setting-row">
      <label>字号</label>
      <div class="option-group" id="fontsize-options">
        <button data-value="large">大</button>
        <button data-value="xlarge">特大</button>
      </div>
    </div>

    <button id="settings-close" class="settings-close">好啦</button>
  </div>
</div>

<div id="share-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="share-title">
  <div class="settings-panel share-panel">
    <h2 id="share-title">分享链接</h2>
    <p class="share-desc">把链接发给家人，就能打开这一类或这一本故事。也可以长按下面的地址复制。</p>
    <textarea id="share-url-input" class="share-url-input" rows="1" readonly></textarea>
    <button type="button" id="share-copy-btn" class="settings-close">复制链接</button>
    <button type="button" id="share-native-btn" class="settings-close share-native-btn hidden">发给家人</button>
    <button type="button" id="share-close-btn" class="share-dismiss">关闭</button>
  </div>
</div>

<div id="copy-toast" class="copy-toast" role="status" aria-live="polite"></div>

<script src="js/settings.js"></script>
<script src="js/reader.js"></script>
<script src="js/app.js"></script>
<script src="books/index.js"></script>
</body>
</html>
